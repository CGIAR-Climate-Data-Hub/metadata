# yaml-language-server: $schema=../spec/schemas/profiles/cdh.schema.json
"$schema": https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/schemas/profiles/cdh.schema.json
cdh_schema_version: "v0.2.0"

extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/extensions/datacube/schema.json

id: ""
title: ""
description: >
  ""
license: ""
access: public # optional - one of: public | restricted | non-public; omit = public
access_note: > # required when access is restricted or non-public
  ""
resource_type: dataset
keywords:
  - ""

contact:
  - organization: ""
    roles: [licensor]
    email: ""
    url: ""

citation:
  authors:
    - ""
  date: ""
  publisher: ""

spatial:
  bbox: [] # optional overall extent when known
  geography: []
  resolution:
    - type: polygon # point or polygon
      value:
      unit: "" # e.g. admin-level
      label: ""
      reference_system: "" # boundary/station system used by the join key
      note: >
        Rows are keyed to external spatial features or locations; geometries are not embedded.

temporal:
  start_date: ""
  end_date: ""

dimensions:
  # The key column(s) rows are keyed on, e.g. adm0_code + adm2_code, or station_id.
  - name: "" # e.g. adm2_code
    type: spatial
    description: ""
    reference_system: "" # vocabulary the codes come from, e.g. GAUL 2015 (resolvable URI preferred)

variables:
  - name: ""
    dimensions: []
    description: ""
    data_type: ""
    unit: ""
    note: >
      ""

# Join to the dataset holding the geometries (its own record). Pair this table's
# key columns with the target's, positionally; composite keys and differing
# column names are fine.
joins:
  - target: "" # resolvable URI/id of the boundary/station dataset
    left_fields: [] # key columns in this record, e.g. [adm0_code, adm2_code]
    right_fields: [] # matching columns in the target, e.g. [ADM0_CODE, ADM2_CODE]

cdh:
  domain: []
  usage:
    not_recommended_for:
      - use: ""
        reason: ""
        use_instead: ""

processing:
  - id: source
    description: ""
    date: ""
    derived_from:
      - url: ""
        title: ""

data:
  - name: ""
    locations:
      - url: ""
        title: ""
    processing_steps: []
    description: ""
    media_type: "" # e.g. text/csv, application/parquet
    file_size: ""
