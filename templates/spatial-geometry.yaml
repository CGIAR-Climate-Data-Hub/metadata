# yaml-language-server: $schema=../spec/schemas/profiles/cdh.schema.json
"$schema": https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/schemas/profiles/cdh.schema.json
cdh_schema_version: "v0.2.0"

extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/extensions/datacube/schema.json

id: ""
title: ""
description: >
  ""
license: ""
access: public # optional - one of: public | restricted | non-public; omit = public
access_note: > # required when access is restricted or non-public
  ""
resource_type: dataset
keywords:
  - ""

contact:
  - organization: ""
    roles: [licensor]
    email: ""
    url: ""

citation:
  authors:
    - ""
  date: ""
  publisher: ""

spatial:
  bbox: [] # [xmin, ymin, xmax, ymax]
  geography: []
  crs: "" # CRS of the embedded geometries, e.g. EPSG:4326
  geometry_column: "" # e.g. geometry, geom; omit if the format has no named geometry column
  resolution:
    - type: polygon # point or polygon
      label: ""
      reference_system: ""

temporal:
  start_date: ""
  end_date: ""

variables:
  - name: ""
    description: ""
    data_type: ""
    unit: ""
    note: >
      ""

cdh:
  domain: []
  usage:
    not_recommended_for:
      - use: ""
        reason: ""
        use_instead: ""

processing:
  - id: source
    description: ""
    date: ""
    derived_from:
      - url: ""
        title: ""

data:
  - name: ""
    locations:
      - url: ""
        title: ""
    processing_steps: []
    description: ""
    media_type: "" # e.g. application/geoparquet, application/geopackage+sqlite3
    file_size: ""
