"$schema": https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/schemas/profiles/cdh.schema.json
cdh_schema_version: "v0.2.0"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.2.0/extensions/datacube/schema.json
id: fixture-record
title: Two dimensions sharing a name
description: A deliberately broken record for the negative test suite.
license: CC-BY-4.0
resource_type: dataset
keywords: [fixture]
cdh:
  domain: [climate]
contact:
  - organization: Example Org
    roles: [licensor]
citation:
  authors: [Doe, J.]
  date: "2026"
data:
  - name: primary
    locations:
      - url: https://example.org/data.zarr
# cube:dimensions is keyed by name, so the second `period` would overwrite the
# first and one temporal axis would vanish from the published cube.
dimensions:
  - name: period
    type: temporal
    description: 20-year projection window.
    values: ["2020-2040", "2041-2060"]
    step: P20Y
  - name: period
    type: temporal
    description: Season within each window.
    values: [DJF, MAM, JJA, SON]
    step: P3M
