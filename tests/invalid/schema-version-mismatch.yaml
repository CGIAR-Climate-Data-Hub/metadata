# $schema pins v9.9.9 while cdh_schema_version claims the current release - a
# deliberate mismatch. v9.9.9 is an unreal version, so the release bump script
# never rewrites it and this stays a genuine mismatch across versions.
cdh_schema_version: "v0.3.0"
"$schema": https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v9.9.9/schemas/profiles/cdh.schema.json
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
id: fixture-record
title: Fixture record
description: A deliberately broken record for the negative test suite.
license: CC-BY-4.0
resource_type: dataset
keywords: [fixture]
cdh:
  domain: [climate]
contact:
  - organization: Test Org
    roles: [licensor]
citation:
  authors: [Doe, J.]
  date: "2026"
data:
  - name: primary
    locations:
      - url: https://example.org/data.tif
