cdh_schema_version: "v0.1.0"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.1.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.1.0/extensions/datacube/schema.json
id: fixture-record
title: Fixture record
description: A deliberately broken record for the negative test suite.
license: CC-BY-4.0
resource_type: dataset
keywords: [fixture]
cdh:
  domain: [climate]
contact:
  - organization: Test Org
    roles: [licensor]
citation:
  authors: [Doe, J.]
  date: "2026"
dimensions:
  # "variable" is a reserved dimension name; measures belong in variables[].
  - name: variable
    type: bands
    description: Reserved name that must fail validation.
    values: [yield, production]
variables:
  - name: yield
    description: Crop yield per grid cell.
data:
  - name: primary
    locations:
      - url: https://example.org/data.tif
