"$schema": https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/schemas/profiles/cdh.schema.json
cdh_schema_version: "v0.3.0"
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/cdh/schema.json
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.3.0/extensions/datacube/schema.json
id: fixture-record
title: Step on a non-temporal dimension
description: A deliberately broken record for the negative test suite.
license: CC-BY-4.0
resource_type: dataset
keywords: [fixture]
cdh:
  domain: [climate]
contact:
  - organization: Example Org
    roles: [licensor]
citation:
  authors: [Doe, J.]
  date: "2026"
data:
  - name: primary
    locations:
      - url: https://example.org/data.zarr
# `time` is a rejected alias: a temporal axis must be spelled `temporal`, or it
# would silently serialize as a domain axis.
dimensions:
  - name: horizon
    type: time
    description: Projection horizon.
    values: [2030, 2050]
